name: Build Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar Music Library Manager v0.7
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar pip' }

          python -m pip install -r requirements.txt `
            'pyinstaller>=6.16,<7' `
            'numpy>=2.1,<3' `
            'soundfile>=0.13,<1' `
            pytest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependencias' }

          python -c "import numpy, soundfile, PySide6, mutagen, keyring; print('Dependencias OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Verificacao de imports falhou' }

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup' }

      - name: Executar testes
        shell: pwsh
        run: |
          python -m pytest . -v --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam' }

      - name: Compilar EXE e instalador
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build falhou' }

      - name: Verificar artefatos gerados
        shell: pwsh
        run: |
          $portatil = 'release\MusicLibraryManager_Portatil_v0.7_Windows_x64.zip'
          $setup    = 'release\MusicLibraryManager_Setup_v0.7_Windows_x64.exe'
          if (!(Test-Path $portatil)) { throw "ZIP portatil ausente: $portatil" }
          if (!(Test-Path $setup))    { throw "Instalador ausente: $setup" }
          Write-Host '=== Artefatos gerados ==='
          Get-ChildItem release\* | ForEach-Object {
            Write-Host ("{0,-55} {1,10} bytes" -f $_.Name, $_.Length)
          }

      - name: Publicar artefatos (CI)
        uses: actions/upload-artifact@v4
        with:
          name: MusicLibraryManager-Windows-v0.7
          path: |
            release\*.exe
            release\*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Criar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Music Library Manager ${{ github.ref_name }}
          body: |
            ## Music Library Manager ${{ github.ref_name }} — Windows x64

            Interface em português para download e organização de músicas FLAC.
            Integra spotDL (Spotify), tiddl (TIDAL), Lidarr, Prowlarr, qBittorrent e Jellyfin.

            ### Download

            | Arquivo | Descrição |
            |---|---|
            | `MusicLibraryManager_Setup_*.exe` | Instalador (recomendado) — instala com atalho no menu Iniciar |
            | `MusicLibraryManager_Portatil_*.zip` | Portátil — extraia e execute sem instalar |

            ### Requisitos
            - Windows 10/11 x64
            - FFmpeg no PATH: `winget install --id Gyan.FFmpeg -e`
            - Para TIDAL: execute `tiddl auth login` na primeira vez
            - Para Spotify/YouTube: spotDL já incluso no pacote

            ### Serviços opcionais (configurar em Configurações)
            Lidarr · Prowlarr · qBittorrent · Jellyfin
          files: |
            release\*.exe
            release\*.zip
          draft: false
          prerelease: false
