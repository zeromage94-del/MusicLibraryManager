name: Gerar instalador Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Music Library Manager (Windows x64)
    # Server 2022 builds x64 executables compatible with Windows 11.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Instalar dependencias Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar pip' }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependencias' }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup' }

      - name: Testar e gerar EXEs, instalador e ZIP portatil
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: MusicLibraryManager-Setup-Windows-v0.7
          path: release/MusicLibraryManager_Setup_v0.7_Windows_x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar ZIP portatil
        uses: actions/upload-artifact@v4
        with:
          name: MusicLibraryManager-Portatil-Windows-v0.7
          path: release/MusicLibraryManager_Portatil_v0.7_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
